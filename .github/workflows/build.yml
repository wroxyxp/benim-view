name: Build Dylib
on: [push]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Randomblock1/theos-action@v1.6
      - run: make
      - uses: actions/upload-artifact@v4
        with:
          name: BenimView-dylib
          path: .theos/obj/debug/BenimView.dylib
